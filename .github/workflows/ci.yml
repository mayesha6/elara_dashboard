name: Greetely Dashboard CI/CD Checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  secret-scan-and-lint:
    name: Secret Scanning, Linting & Type-checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scanning Check
        run: |
          if [ -f .env.local ]; then
            echo "Error: .env.local should not be committed!"
            exit 1
          fi

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Automated Tests
        run: npm test

  production-build-check:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: secret-scan-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        env:
          NEXT_PUBLIC_BASE_URL: "https: //api.greetely.com/api/v1"
          NEXT_PUBLIC_WEBSITE_URL: "https://greetely.com"
          NEXTAUTH_URL: "https://dashboard.greetely.com"
        run: npm run build
